<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际调度员 | Interstellar Dispatcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0015;
            font-family: 'Courier New', monospace;
        }

        #gameCanvas {
            display: block;
            cursor: none;
        }

        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #00ffff;
            font-size: 14px;
            text-shadow: 0 0 10px #00ffff;
            z-index: 100;
            user-select: none;
        }

        #score {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        #instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #8866ff;
            font-size: 12px;
            opacity: 0.7;
            z-index: 100;
        }

        #audioToggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 10px 15px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            z-index: 100;
            transition: all 0.3s;
        }

        #audioToggle:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 15px #00ffff;
        }

        .glow-text {
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; }
            to { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 60px #0088ff; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
        <div id="score" class="glow-text">0</div>
        <div id="combo">连击: 0x</div>
        <div id="multiplier">倍率: 1.0x</div>
    </div>

    <div id="instructions">
        WASD / 方向键 移动 | 鼠标 瞄准方向 | 空格 加速冲刺
    </div>

    <button id="audioToggle">🔊 音效</button>

    <script>
// ============================================
// 星际调度员 - Interstellar Dispatcher
// 极简赛博风格飞行收集游戏原型
// ============================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 画布尺寸设置
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ============================================
// 音频系统（Web Audio API 合成器）
// ============================================
class AudioSystem {
    constructor() {
        this.enabled = false;
        this.audioCtx = null;
        this.masterGain = null;
        this.initialized = false;
    }

    init() {
        if (this.initialized) return;
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.audioCtx.createGain();
        this.masterGain.gain.value = 0.3;
        this.masterGain.connect(this.audioCtx.destination);
        this.initialized = true;
    }

    toggle() {
        if (!this.initialized) this.init();
        this.enabled = !this.enabled;
        return this.enabled;
    }

    // 收集音效 - 上升的合成器音
    playCollect(pitch = 1) {
        if (!this.enabled || !this.audioCtx) return;

        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(440 * pitch, this.audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880 * pitch, this.audioCtx.currentTime + 0.1);

        gain.gain.setValueAtTime(0.3, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start();
        osc.stop(this.audioCtx.currentTime + 0.3);
    }

    // 冲刺音效
    playDash() {
        if (!this.enabled || !this.audioCtx) return;

        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, this.audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, this.audioCtx.currentTime + 0.2);

        gain.gain.setValueAtTime(0.2, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.2);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start();
        osc.stop(this.audioCtx.currentTime + 0.2);
    }

    // 背景低频脉冲
    playAmbientPulse() {
        if (!this.enabled || !this.audioCtx) return;

        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.value = 60;

        gain.gain.setValueAtTime(0.05, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.5);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start();
        osc.stop(this.audioCtx.currentTime + 0.5);
    }
}

const audio = new AudioSystem();

// ============================================
// 游戏状态
// ============================================
const game = {
    score: 0,
    combo: 0,
    multiplier: 1,
    comboTimer: 0,
    screenShake: { x: 0, y: 0, intensity: 0 },
    time: 0,
    gridOffset: 0
};

// ============================================
// 输入系统
// ============================================
const input = {
    keys: {},
    mouse: { x: canvas.width / 2, y: canvas.height / 2 },
    dash: false
};

document.addEventListener('keydown', (e) => {
    input.keys[e.key.toLowerCase()] = true;
    if (e.code === 'Space') {
        e.preventDefault();
        input.dash = true;
    }
});

document.addEventListener('keyup', (e) => {
    input.keys[e.key.toLowerCase()] = false;
    if (e.code === 'Space') input.dash = false;
});

document.addEventListener('mousemove', (e) => {
    input.mouse.x = e.clientX;
    input.mouse.y = e.clientY;
});

// ============================================
// 玩家（正八面体）
// ============================================
class Player {
    constructor() {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
        this.vx = 0;
        this.vy = 0;
        this.size = 25;
        this.rotation = 0;
        this.rotationSpeed = 0;
        this.trail = [];
        this.maxTrailLength = 50;
        this.glowIntensity = 1;
        this.dashCooldown = 0;
        this.isDashing = false;
    }

    update(dt) {
        // 输入处理
        let ax = 0, ay = 0;
        const acceleration = this.isDashing ? 2000 : 800;

        if (input.keys['w'] || input.keys['arrowup']) ay -= acceleration;
        if (input.keys['s'] || input.keys['arrowdown']) ay += acceleration;
        if (input.keys['a'] || input.keys['arrowleft']) ax -= acceleration;
        if (input.keys['d'] || input.keys['arrowright']) ax += acceleration;

        // 鼠标方向影响（轻微吸引）
        const dx = input.mouse.x - this.x;
        const dy = input.mouse.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 50) {
            ax += (dx / dist) * 100;
            ay += (dy / dist) * 100;
        }

        // 冲刺系统
        if (input.dash && this.dashCooldown <= 0 && !this.isDashing) {
            this.isDashing = true;
            this.dashCooldown = 1.5;
            const dashSpeed = 800;
            const angle = Math.atan2(dy, dx);
            this.vx += Math.cos(angle) * dashSpeed;
            this.vy += Math.sin(angle) * dashSpeed;
            audio.playDash();

            // 冲刺粒子爆发
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(
                    this.x, this.y,
                    (Math.random() - 0.5) * 400 - this.vx * 0.5,
                    (Math.random() - 0.5) * 400 - this.vy * 0.5,
                    '#00ffff', 0.5
                ));
            }
        }

        if (this.dashCooldown > 0) this.dashCooldown -= dt;
        if (this.isDashing && this.dashCooldown < 1.3) this.isDashing = false;

        // 应用加速度
        this.vx += ax * dt;
        this.vy += ay * dt;

        // 阻尼（丝滑惯性）
        const damping = this.isDashing ? 0.98 : 0.96;
        this.vx *= Math.pow(damping, dt * 60);
        this.vy *= Math.pow(damping, dt * 60);

        // 速度限制
        const maxSpeed = this.isDashing ? 1200 : 600;
        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        if (speed > maxSpeed) {
            this.vx = (this.vx / speed) * maxSpeed;
            this.vy = (this.vy / speed) * maxSpeed;
        }

        // 更新位置
        this.x += this.vx * dt;
        this.y += this.vy * dt;

        // 边界处理（环绕）
        const margin = this.size * 2;
        if (this.x < -margin) this.x = canvas.width + margin;
        if (this.x > canvas.width + margin) this.x = -margin;
        if (this.y < -margin) this.y = canvas.height + margin;
        if (this.y > canvas.height + margin) this.y = -margin;

        // 旋转
        this.rotationSpeed = speed * 0.003;
        this.rotation += this.rotationSpeed * dt * 60;

        // 发光强度随速度变化
        this.glowIntensity = 1 + speed / 600;

        // 尾迹
        this.trail.unshift({ x: this.x, y: this.y, age: 0 });
        if (this.trail.length > this.maxTrailLength) {
            this.trail.pop();
        }
        this.trail.forEach(p => p.age += dt);
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        // 绘制尾迹
        if (this.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(0, 0);

            for (let i = 0; i < this.trail.length; i++) {
                const p = this.trail[i];
                const alpha = 1 - i / this.trail.length;
                const relX = p.x - this.x;
                const relY = p.y - this.y;

                ctx.lineTo(relX, relY);
            }

            const gradient = ctx.createLinearGradient(0, 0,
                this.trail[this.trail.length - 1].x - this.x,
                this.trail[this.trail.length - 1].y - this.y);
            gradient.addColorStop(0, `rgba(0, 255, 255, 0.8)`);
            gradient.addColorStop(0.5, `rgba(136, 102, 255, 0.4)`);
            gradient.addColorStop(1, `rgba(136, 102, 255, 0)`);

            ctx.strokeStyle = gradient;
            ctx.lineWidth = this.size * 0.6;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        // 绘制发光效果
        const glowSize = this.size * this.glowIntensity;
        const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, glowSize * 2);
        gradient.addColorStop(0, `rgba(0, 255, 255, 0.4)`);
        gradient.addColorStop(0.5, `rgba(136, 102, 255, 0.2)`);
        gradient.addColorStop(1, `rgba(136, 102, 255, 0)`);

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, glowSize * 2, 0, Math.PI * 2);
        ctx.fill();

        // 绘制正八面体（2D投影）
        ctx.rotate(this.rotation);

        // 外层
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const r = this.size * (i % 2 === 0 ? 1 : 0.6);
            const px = Math.cos(angle) * r;
            const py = Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();

        ctx.fillStyle = `rgba(0, 255, 255, 0.3)`;
        ctx.fill();
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 20 * this.glowIntensity;
        ctx.stroke();

        // 内部结构
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
            const angle = (i / 4) * Math.PI * 2 + this.rotation * 0.5;
            ctx.moveTo(0, 0);
            const px = Math.cos(angle) * this.size * 0.8;
            const py = Math.sin(angle) * this.size * 0.8;
            ctx.lineTo(px, py);
        }
        ctx.strokeStyle = `rgba(255, 255, 255, 0.5)`;
        ctx.lineWidth = 1;
        ctx.stroke();

        // 中心核心
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.15, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 15;
        ctx.fill();

        ctx.restore();
    }
}

// ============================================
// 资源核心
// ============================================
class ResourceCore {
    constructor() {
        this.reset();
    }

    reset() {
        // 随机位置（避开边缘）
        const margin = 100;
        this.x = margin + Math.random() * (canvas.width - margin * 2);
        this.y = margin + Math.random() * (canvas.height - margin * 2);

        // 随机类型
        this.types = [
            { color: '#ff00ff', shape: 'triangle', points: 10, name: '能量核心' },
            { color: '#ffff00', shape: 'square', points: 15, name: '数据晶体' },
            { color: '#00ff88', shape: 'pentagon', points: 20, name: '量子碎片' },
            { color: '#ff6600', shape: 'hexagon', points: 25, name: '星尘精华' },
            { color: '#00ffff', shape: 'diamond', points: 30, name: '虚空之核' }
        ];

        const typeIndex = Math.floor(Math.random() * this.types.length);
        this.type = this.types[typeIndex];
        this.color = this.type.color;
        this.shape = this.type.shape;
        this.points = this.type.points;

        this.size = 20 + Math.random() * 15;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 2;
        this.pulsePhase = Math.random() * Math.PI * 2;
        this.collected = false;
        this.spawnTime = game.time;
    }

    update(dt) {
        this.rotation += this.rotationSpeed * dt;
        this.pulsePhase += dt * 3;
    }

    draw(ctx) {
        if (this.collected) return;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        const pulse = 1 + Math.sin(this.pulsePhase) * 0.15;
        const size = this.size * pulse;

        // 发光效果
        const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 2);
        gradient.addColorStop(0, this.color + '66');
        gradient.addColorStop(0.5, this.color + '22');
        gradient.addColorStop(1, this.color + '00');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, size * 2, 0, Math.PI * 2);
        ctx.fill();

        // 绘制形状
        ctx.beginPath();
        const sides = this.getSides();
        for (let i = 0; i < sides; i++) {
            const angle = (i / sides) * Math.PI * 2 - Math.PI / 2;
            const px = Math.cos(angle) * size;
            const py = Math.sin(angle) * size;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();

        ctx.fillStyle = this.color + '44';
        ctx.fill();
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;
        ctx.stroke();

        ctx.restore();
    }

    getSides() {
        switch (this.shape) {
            case 'triangle': return 3;
            case 'square': return 4;
            case 'diamond': return 4;
            case 'pentagon': return 5;
            case 'hexagon': return 6;
            default: return 6;
        }
    }

    checkCollision(player) {
        if (this.collected) return false;
        const dx = this.x - player.x;
        const dy = this.y - player.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        return dist < this.size + player.size;
    }
}

// ============================================
// 粒子系统
// ============================================
class Particle {
    constructor(x, y, vx, vy, color, life = 1) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.life = life;
        this.maxLife = life;
        this.size = 3 + Math.random() * 5;
    }

    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vx *= 0.98;
        this.vy *= 0.98;
        this.life -= dt;
        return this.life > 0;
    }

    draw(ctx) {
        const alpha = this.life / this.maxLife;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
        ctx.fillStyle = this.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
        ctx.fill();
    }
}

// ============================================
// 光波效果
// ============================================
class Shockwave {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = 0;
        this.maxRadius = 200;
        this.life = 1;
        this.speed = 400;
    }

    update(dt) {
        this.radius += this.speed * dt;
        this.life = 1 - this.radius / this.maxRadius;
        return this.life > 0;
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = this.color + Math.floor(this.life * 200).toString(16).padStart(2, '0');
        ctx.lineWidth = 3 * this.life;
        ctx.stroke();
    }
}

// ============================================
// 游戏对象初始化
// ============================================
const player = new Player();
const resources = [];
const particles = [];
const shockwaves = [];

// 初始化资源核心
for (let i = 0; i < 8; i++) {
    resources.push(new ResourceCore());
}

// ============================================
// 背景渲染
// ============================================
function drawBackground(ctx) {
    // 深紫色背景
    const bgGradient = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, 0,
        canvas.width / 2, canvas.height / 2, canvas.width * 0.7
    );
    bgGradient.addColorStop(0, '#1a0033');
    bgGradient.addColorStop(0.5, '#0f001f');
    bgGradient.addColorStop(1, '#050010');

    ctx.fillStyle = bgGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 流动网格线
    const gridSize = 80;
    const offset = game.gridOffset % gridSize;

    ctx.strokeStyle = 'rgba(136, 102, 255, 0.15)';
    ctx.lineWidth = 1;

    // 垂直线
    for (let x = -gridSize + offset; x < canvas.width + gridSize; x += gridSize) {
        const wave = Math.sin((x + game.time * 50) * 0.01) * 10;
        ctx.beginPath();
        ctx.moveTo(x + wave, 0);
        ctx.lineTo(x - wave, canvas.height);
        ctx.stroke();
    }

    // 水平线
    for (let y = -gridSize + offset; y < canvas.height + gridSize; y += gridSize) {
        const wave = Math.sin((y + game.time * 30) * 0.01) * 10;
        ctx.beginPath();
        ctx.moveTo(0, y + wave);
        ctx.lineTo(canvas.width, y - wave);
        ctx.stroke();
    }

    // 透视网格（地平面效果）
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.08)';
    const horizon = canvas.height * 0.4;
    const perspectiveLines = 20;

    for (let i = 0; i < perspectiveLines; i++) {
        const t = i / perspectiveLines;
        const y = horizon + (canvas.height - horizon) * Math.pow(t, 1.5);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }
}

// ============================================
// 收集处理
// ============================================
function handleCollection(resource) {
    resource.collected = true;

    // 更新分数和连击
    game.combo++;
    game.comboTimer = 2;
    game.multiplier = 1 + game.combo * 0.1;
    const points = Math.floor(resource.points * game.multiplier);
    game.score += points;

    // 屏幕震动
    game.screenShake.intensity = 8;

    // 爆炸粒子
    for (let i = 0; i < 30; i++) {
        const angle = (i / 30) * Math.PI * 2;
        const speed = 100 + Math.random() * 200;
        particles.push(new Particle(
            resource.x, resource.y,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed,
            resource.color, 0.8
        ));
    }

    // 光波
    shockwaves.push(new Shockwave(resource.x, resource.y, resource.color));

    // 音效
    const pitch = 0.8 + (resource.points / 30) * 0.6;
    audio.playCollect(pitch);

    // 重置资源
    setTimeout(() => resource.reset(), 500);

    // 更新UI
    updateUI();
}

// ============================================
// UI更新
// ============================================
function updateUI() {
    document.getElementById('score').textContent = game.score.toLocaleString();
    document.getElementById('combo').textContent = `连击: ${game.combo}x`;
    document.getElementById('multiplier').textContent = `倍率: ${game.multiplier.toFixed(1)}x`;
}

// ============================================
// 主游戏循环
// ============================================
let lastTime = 0;

function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    game.time += dt;
    game.gridOffset += dt * 20;

    // 连击计时器
    if (game.comboTimer > 0) {
        game.comboTimer -= dt;
        if (game.comboTimer <= 0) {
            game.combo = 0;
            game.multiplier = 1;
            updateUI();
        }
    }

    // 屏幕震动衰减
    if (game.screenShake.intensity > 0) {
        game.screenShake.x = (Math.random() - 0.5) * game.screenShake.intensity;
        game.screenShake.y = (Math.random() - 0.5) * game.screenShake.intensity;
        game.screenShake.intensity *= 0.9;
        if (game.screenShake.intensity < 0.5) game.screenShake.intensity = 0;
    } else {
        game.screenShake.x = 0;
        game.screenShake.y = 0;
    }

    // 更新
    player.update(dt);
    resources.forEach(r => r.update(dt));

    // 碰撞检测
    resources.forEach(r => {
        if (r.checkCollision(player)) {
            handleCollection(r);
        }
    });

    // 更新粒子
    for (let i = particles.length - 1; i >= 0; i--) {
        if (!particles[i].update(dt)) {
            particles.splice(i, 1);
        }
    }

    // 更新光波
    for (let i = shockwaves.length - 1; i >= 0; i--) {
        if (!shockwaves[i].update(dt)) {
            shockwaves.splice(i, 1);
        }
    }

    // 渲染
    ctx.save();
    ctx.translate(game.screenShake.x, game.screenShake.y);

    drawBackground(ctx);

    // 绘制光波
    shockwaves.forEach(s => s.draw(ctx));

    // 绘制资源核心
    resources.forEach(r => r.draw(ctx));

    // 绘制粒子
    particles.forEach(p => p.draw(ctx));

    // 绘制玩家
    player.draw(ctx);

    // 绘制自定义光标
    ctx.beginPath();
    ctx.arc(input.mouse.x, input.mouse.y, 5, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(input.mouse.x - 10, input.mouse.y);
    ctx.lineTo(input.mouse.x + 10, input.mouse.y);
    ctx.moveTo(input.mouse.x, input.mouse.y - 10);
    ctx.lineTo(input.mouse.x, input.mouse.y + 10);
    ctx.stroke();

    ctx.restore();

    // 环境脉冲音效
    if (Math.random() < 0.005) {
        audio.playAmbientPulse();
    }

    requestAnimationFrame(gameLoop);
}

document.getElementById('audioToggle').addEventListener('click', () => {
    const enabled = audio.toggle();
    document.getElementById('audioToggle').textContent = enabled ? '🔊 音效' : '🔇 静音';
});
